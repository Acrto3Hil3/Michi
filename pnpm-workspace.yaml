packages:
  - packages/*

# esbuild is a dev-only transitive dependency of vitest. Its postinstall only
# fetches a platform binary that is already installed as an optional
# dependency, so the script is denied rather than approved.
# See docs/specs/SECURITY_MODEL.md, "Supply chain": no postinstall scripts.
allowBuilds:
  # The extension packaging toolchain: vsce-sign fetches a signing binary and
  # keytar builds a keychain module. MICHI signs no extensions and reads no
  # keychain, and `vsce package` works without either.
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
